name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-worker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./worker

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: worker/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Tests
      run: npm run test
