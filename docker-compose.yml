version: '3.8'

services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    volumes:
      # Mount the host's Docker socket so the worker can run test case containers
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Provide these via a .env file in the same directory as this compose file
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
