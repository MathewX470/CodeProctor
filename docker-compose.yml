services:
  redis:
    image: redis:alpine
    container_name: codeproctor-redis
    restart: unless-stopped
    # Expose port 6379 to the internet so Vercel can queue jobs!
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: codeproctor-worker
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}

  # --- Runners ---
  runner-c:
    image: runner-c:latest
    build: docker/c
    profiles: ["runners"]

  runner-cpp:
    image: runner-cpp:latest
    build: docker/cpp
    profiles: ["runners"]

  runner-java:
    image: runner-java:latest
    build: docker/java
    profiles: ["runners"]

  runner-python:
    image: runner-python:latest
    build: docker/python
    profiles: ["runners"]

  runner-node:
    image: runner-node:latest
    build: docker/javascript
    profiles: ["runners"]

volumes:
  redis_data:
